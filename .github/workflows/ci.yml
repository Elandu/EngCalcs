name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Test
        run: pytest

  openwind-integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install OpenCalcs and OpenWind
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install "git+https://github.com/Elandu/OpenWind-AU.git@bc054f23d2645eb9dfe44b1b4b504a94ebec01db"

      - name: Verify plugin discovery and execution
        run: |
          python - <<'PY'
          from opencalcs.registry import CalculationRegistry

          registry = CalculationRegistry()
          plugin_ids = {plugin.id for plugin in registry.plugins}
          calculation_ids = {item["id"] for item in registry.list_calculations()}

          assert "au.openwind" in plugin_ids
          assert "au.wind.regional_wind_speed" in calculation_ids
          assert registry.run(
              "au.wind.regional_wind_speed",
              {"region": "A2", "ari_years": 500},
          )["regional_wind_speed_m_s"] > 0
          PY
