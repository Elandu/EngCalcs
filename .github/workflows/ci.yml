name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Test
        run: pytest

  pynite-integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install OpenCalcs and PyNite adapter
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -e ./plugins/pynite

      - name: Test PyNite adapter and OpenCalcs registry wiring
        run: python -m pytest plugins/pynite/tests

      - name: Run PyNite analytical frame benchmark
        run: python benchmarks/compare_frame_solvers.py --json "$RUNNER_TEMP/pynite-benchmark.json"

  openwind-integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install OpenCalcs and OpenWind
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r requirements-render.txt

      - name: Test OpenWind host integration
        run: python -m pytest tests/test_workflows.py

      - name: Verify plugin discovery and execution
        run: |
          python - <<'PY'
          from opencalcs.registry import CalculationRegistry

          registry = CalculationRegistry()
          plugin_ids = {plugin.id for plugin in registry.plugins}
          calculation_ids = {item["id"] for item in registry.list_calculations()}
          expected_calculations = {
              "au.wind.regional_wind_speed",
              "au.wind.as4055.housing_assessment",
              "au.wind.as4055.housing_surface_loads",
              "au.wind.as4055.pressure_zone_areas",
              "au.wind.as4055.racking_pressure",
              "au.wind.frame_loads",
          }

          assert "au.openwind" in plugin_ids
          assert expected_calculations <= calculation_ids
          assert registry.run(
              "au.wind.regional_wind_speed",
              {"region": "A2", "ari_years": 500},
          )["regional_wind_speed_m_s"] > 0
          PY
