name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Test
        run: pytest

  pynite-integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install EngCalcs and PyNite adapter
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -e ./plugins/pynite

      - name: Test PyNite adapter and EngCalcs registry wiring
        run: python -m pytest plugins/pynite/tests

      - name: Run PyNite analytical frame benchmark
        run: python benchmarks/compare_frame_solvers.py --json "$RUNNER_TEMP/pynite-benchmark.json"

  openwind-integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install EngCalcs and OpenWind
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r requirements-render.txt

      - name: Test OpenWind host integration
        run: python -m pytest tests/test_workflows.py

      - name: Verify all pinned standards modules and link contracts
        run: python -m pytest -q integration_checks

      - name: Verify plugin discovery and execution
        run: |
          python - <<'PY'
          from engcalcs.registry import CalculationRegistry

          registry = CalculationRegistry()
          plugin_ids = {plugin.id for plugin in registry.plugins}
          calculation_ids = {item["id"] for item in registry.list_calculations()}
          expected_calculations = {
              "au.wind.regional_wind_speed",
              "au.wind.as4055.housing_assessment",
              "au.wind.as4055.housing_surface_loads",
              "au.wind.as4055.pressure_zone_areas",
              "au.wind.as4055.racking_pressure",
              "au.wind.frame_loads",
          }

          assert "au.openwind" in plugin_ids
          assert expected_calculations <= calculation_ids
          assert registry.run(
              "au.wind.regional_wind_speed",
              {"region": "A2", "ari_years": 500},
          )["regional_wind_speed_m_s"] > 0

          # Structural section plugins pinned for production.
          assert {"structural.as1170", "structural.as1720", "stormwater.as3500", "structural.as3600", "structural.as4100", "structural.pynite"} <= plugin_ids
          steel = registry.run(
              "structural.as4100.section_analysis",
              {
                  "gross_area_mm2": 2000,
                  "net_area_mm2": 1500,
                  "yield_strength_mpa": 250,
                  "ultimate_strength_mpa": 400,
                  "tension_distribution_factor": 0.8,
                  "compression_form_factor": 0.8,
                  "tension_action_kn": 200,
                  "compression_action_kn": 135,
              },
          )
          assert abs(steel["tension"]["design_capacity_kn"] - 367.2) < 1e-6
          assert abs(steel["compression"]["design_capacity_kn"] - 270.0) < 1e-6
          concrete = registry.run(
              "structural.as3600.section_analysis",
              {
                  "section": {
                      "width_mm": 300,
                      "depth_mm": 500,
                      "bars": [
                          {"id": "B1", "area_mm2": 500, "x_mm": 60, "y_mm": 50},
                          {"id": "B2", "area_mm2": 500, "x_mm": 150, "y_mm": 50},
                          {"id": "B3", "area_mm2": 500, "x_mm": 240, "y_mm": 50},
                      ],
                  },
                  "concrete": {
                      "elastic_modulus_mpa": 30000,
                      "compressive_strength_mpa": 32,
                      "density_kg_m3": 2400,
                      "stress_block_alpha": 0.8,
                      "stress_block_gamma": 0.8,
                      "ultimate_compressive_strain": 0.003,
                  },
                  "steel": {
                      "elastic_modulus_mpa": 200000,
                      "yield_strength_mpa": 500,
                      "density_kg_m3": 7850,
                      "fracture_strain": 0.05,
                  },
              },
          )
          assert concrete["standard_compliance_evaluated"] is False
          assert concrete["ultimate"]["resultant_moment_knm"] > 0
          PY
