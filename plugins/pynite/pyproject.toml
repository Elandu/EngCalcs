[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "engcalcs-pynite"
version = "0.1.0"
description = "PyNite 3D frame analysis plugin for EngCalcs."
requires-python = ">=3.11"
license = "LicenseRef-EngCalcs-Proprietary"
dependencies = [
  "jsonschema>=4.22,<5",
  "PyniteFEA>=3.2.0,<4",
]

[project.entry-points."engcalcs.plugins"]
pynite = "engcalcs_pynite.plugin:get_plugin"

[project.entry-points."opencalcs.plugins"]
pynite = "opencalcs_pynite.plugin:get_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/engcalcs_pynite", "src/opencalcs_pynite"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
