[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "engcalcs"
version = "0.1.0"
description = "Modular engineering calculation host and API."
readme = "README.md"
license = "AGPL-3.0-only"
authors = [{ name = "Elandu" }]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.11,<3",
  "mcp>=1.30,<2",
  "httpx>=0.27,<0.29",
  "reportlab>=4.2,<5",
]

[project.urls]
Repository = "https://github.com/Elandu/OpenCalcs"
Issues = "https://github.com/Elandu/OpenCalcs/issues"

[project.scripts]
engcalcs-mcp = "engcalcs.mcp_server:main"
opencalcs-mcp = "engcalcs.mcp_server:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/engcalcs", "src/opencalcs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/engcalcs/api.py" = ["B008"]
